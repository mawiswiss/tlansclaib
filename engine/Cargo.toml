[package]
name = "tlansclaib-engine"
description = "Transcribes an audio file with whisper.cpp and reports progress as JSON lines"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "engine"
path = "src/lib.rs"

[[bin]]
name = "tlansclaib-engine"
path = "src/main.rs"
required-features = ["whisper"]

[features]
default = ["whisper"]
whisper = ["dep:whisper-rs", "dep:symphonia", "dep:rubato", "dep:clap", "dep:env_logger", "dep:log", "dep:num_cpus", "dep:libloading"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }
libloading = { version = "0.8", optional = true }
log = { version = "0.4", optional = true }
num_cpus = { version = "1", optional = true }
rubato = { version = "5", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", features = ["all"], optional = true }
whisper-rs = { version = "0.16", features = ["log_backend"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
