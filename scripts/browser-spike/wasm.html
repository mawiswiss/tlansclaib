<!doctype html>
<meta charset="utf-8">
<title>whisper.cpp wasm</title>
<pre id="out">running</pre>
<script type="module">
const params = new URLSearchParams(location.search);
const worker = new Worker('./wasm-worker.js', { type: 'module' });
window.result = new Promise((resolve) => {
    worker.onmessage = ({ data }) => resolve(data);
    worker.onerror = (event) => resolve({ error: event.message ?? String(event) });
});
worker.postMessage({
    model: params.get('model') ?? 'ggml-large-v3-turbo-q5_0.bin',
    threads: Number(params.get('threads') ?? 4),
    runs: Number(params.get('runs') ?? 2),
});
window.result.then((r) => { document.getElementById('out').textContent = JSON.stringify(r, null, 1); });
</script>
