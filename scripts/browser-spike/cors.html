<!doctype html>
<meta charset="utf-8">
<title>cross-origin model fetch</title>
<pre id="out">running</pre>
<script type="module">
const urls = {
    github: 'https://github.com/mawiswiss/tlansclaib/releases/download/models-v1/ggml-thai-fast-q8_0.bin',
    huggingface: 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q8_0.bin',
};
async function probe(url, headers) {
    try {
        const response = await fetch(url, { headers });
        const bytes = new Uint8Array(await response.arrayBuffer());
        return { status: response.status, bytes: bytes.length, magic: [...bytes.slice(0, 4)].map((b) => b.toString(16)).join(' '), range: response.headers.get('content-range') };
    } catch (error) {
        return { error: String(error) };
    }
}
async function main() {
    const out = { isolated: crossOriginIsolated };
    for (const [name, url] of Object.entries(urls)) out[name] = await probe(url, { Range: 'bytes=0-15' });
    return out;
}
window.result = main();
window.result.then((r) => { document.getElementById('out').textContent = JSON.stringify(r, null, 1); });
</script>
