name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            assets: tlansclaib-mac[ext]
          - os: windows-2022
            args: ""
            assets: tlansclaib-windows[setup][ext]
    runs-on: ${{ matrix.os }}
    env:
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Vulkan SDK
        if: matrix.os == 'windows-2022'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.341.1
      - name: Keep build paths under the Windows limit
        if: matrix.os == 'windows-2022'
        shell: pwsh
        # MSBuild's file tracker fails on paths of 260 characters and more, which the Vulkan shader build of whisper.cpp reaches.
        run: Add-Content $env:GITHUB_ENV "CARGO_TARGET_DIR=$(Join-Path (Split-Path (Split-Path $env:GITHUB_WORKSPACE)) t)"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.os == 'windows-2022' && '. -> ../../t' || '.' }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sign and notarise with the Apple certificate, once it is set
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ID: ${{ secrets.APPLE_ID }}
          PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # An empty APPLE_CERTIFICATE still makes Tauri try to import it, so the variables exist only with a certificate.
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "No Apple certificate set, the app stays signed ad hoc."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "APPLE_ID=$ID"
            echo "APPLE_PASSWORD=$PASSWORD"
            echo "APPLE_TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"
      - name: Sign the update bundles, once the updater key is set
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY" ]; then
            echo "No updater key set, the release offers no in-app update."
            exit 0
          fi
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$KEY"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$KEY_PASSWORD"
            echo "UPDATER_ARGS=--config src-tauri/tauri.updater.conf.json"
          } >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: tlansclaib ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: |
            Mac, macOS 13 or newer, Apple silicon and Intel: download `tlansclaib-mac.dmg`, open it and drag tlansclaib into Applications.

            Windows 10 or 11: download `tlansclaib-windows-setup.exe` and run it. SmartScreen asks once: click "More info", then "Run anyway".

            On the first start, open Models and download one for your language.
          assetNamePattern: ${{ matrix.assets }}
          args: ${{ matrix.args }} ${{ env.UPDATER_ARGS }}
      - name: Notarise the disk image too, and check both with Gatekeeper
        if: matrix.os == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # Tauri notarises only the app and signs the disk image around it.
        run: |
          bundle=target/universal-apple-darwin/release/bundle
          dmg=$(ls "$bundle"/dmg/*.dmg)
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          spctl --assess --type execute -vv "$bundle/macos/tlansclaib.app"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"
          cp "$dmg" tlansclaib-mac.dmg
          gh release upload "$GITHUB_REF_NAME" tlansclaib-mac.dmg --clobber

  updater:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check that latest.json offers the update on every platform
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        # Both build jobs merge their platform into latest.json, so a close finish can drop one.
        run: |
          if [ -z "$KEY" ]; then
            exit 0
          fi
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json
          jq -e '.platforms | has("darwin-aarch64") and has("darwin-x86_64") and has("windows-x86_64")' latest.json
