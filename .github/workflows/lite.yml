name: lite

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lite
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'mawiswiss/wavetyper'
    runs-on: ubuntu-latest
    environment:
      name: lite
      url: https://wavetyper.marcwieland.name
    # Actions are pinned to commits, because they can read the Cloudflare token.
    steps:
      - name: Find the latest published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        # Always the latest, so a manual run or a late backport never rolls Lite back.
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          echo "Deploying $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check the Cloudflare secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, see docs/release.md. Lite stays on its previous version."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build:web
      - name: Check that every file fits Cloudflare Pages
        run: |
          if [ -n "$(find dist-web -type f -size +25M)" ]; then
            find dist-web -type f -size +25M
            echo "::error::Cloudflare Pages refuses files over 25 MiB."
            exit 1
          fi
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          pnpm dlx wrangler@4.151.0 pages deploy dist-web --project-name=wavetyper-lite --branch=main \
            --commit-hash="$(git rev-parse HEAD)" --commit-message="wavetyper $TAG"
      - name: Check that the site answers cross-origin isolated
        run: |
          headers=$(curl -fsSI https://wavetyper.marcwieland.name/)
          echo "$headers"
          echo "$headers" | grep -qi '^cross-origin-opener-policy: same-origin'
          echo "$headers" | grep -qi '^cross-origin-embedder-policy: require-corp'
